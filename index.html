<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BlynsOS 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section id="boot" class="ph on"><img class="boot-logo" src="https://i.postimg.cc/Dy8SsWjX/Blyns-OS-Logo.png" alt="BlynsOS">
    <div id="bar"><i></i></div>
    <div id="hint">Press 0 to power on</div>
  </section>
  <section id="setup" class="ph bg">
    <div class="card" id="sc"></div>
  </section>
  <section id="lock" class="ph wall">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="lu">
      <div class="av" id="lav"></div><b id="lnm"></b><input id="pw" type="password" placeholder="Enter Password" autocomplete="off">
    </div>
  </section>
  <section id="desk" class="ph wall">
    <div id="mb" class="glass">
      <b id="ap" aria-label="BlynsOS menu"></b><b id="an">Files</b><span class="mbmenu" data-menu="File">File</span><span class="mbmenu" data-menu="Window">Window</span><span class="mbmenu" data-menu="Work">Work</span><span class="mbmenu" data-menu="Settings">Settings</span>
      <div class="r">
        <button id="spotlightBtn" aria-label="Spotlight Search" title="Spotlight Search (Ctrl + S)"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg></button><span id="mt"></span><button id="ccbtn" aria-label="Control Center" title="Control Center (C)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg></button>
      </div>
    </div>
    <div id="wins"></div>
    <div id="dock" class="glass"></div>
  </section>
  <div id="hud"><span id="hi">🔊</span>
    <div id="hb"></div>
  </div>
  <div id="siri"><input id="sq" placeholder="Search or Ask"></div>
  <div id="toast"></div>
  <div id="off"></div>
  <script src="script.js"></script>
</body>

</html>
